name: ocr-demo
metadata:
  template: ocr-demo@0.0.1
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ./src/backend
    language: py
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true
  ui:
    project: ./src/ui
    language: py
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true
hooks:
  # provision 後に System Assigned MI で ACR レジストリを設定
  postprovision:
    posix:
      shell: sh
      run: |
        echo ">>> Configuring ACR registry with System Assigned MI..."
        az containerapp registry set \
          -n "$SERVICE_API_NAME" -g "$AZURE_RESOURCE_GROUP" \
          --server "$AZURE_CONTAINER_REGISTRY_ENDPOINT" \
          --identity system --output none
        az containerapp registry set \
          -n "$SERVICE_UI_NAME" -g "$AZURE_RESOURCE_GROUP" \
          --server "$AZURE_CONTAINER_REGISTRY_ENDPOINT" \
          --identity system --output none
        echo ">>> Registry configured."
    windows:
      shell: pwsh
      run: |
        Write-Host ">>> Configuring ACR registry with System Assigned MI..."
        az containerapp registry set `
          -n $env:SERVICE_API_NAME -g $env:AZURE_RESOURCE_GROUP `
          --server $env:AZURE_CONTAINER_REGISTRY_ENDPOINT `
          --identity system --output none
        az containerapp registry set `
          -n $env:SERVICE_UI_NAME -g $env:AZURE_RESOURCE_GROUP `
          --server $env:AZURE_CONTAINER_REGISTRY_ENDPOINT `
          --identity system --output none
        Write-Host ">>> Registry configured."
  # 閉域リソースへのデプロイのため一時的に Public Access を開放
  predeploy:
    posix:
      shell: sh
      run: |
        echo ">>> Temporarily enabling public access for deployment..."
        az acr update -n "$AZURE_CONTAINER_REGISTRY_NAME" --public-network-enabled true --default-action Allow --output none
        echo ">>> Waiting for network changes to propagate (30s)..."
        sleep 30
    windows:
      shell: pwsh
      run: |
        Write-Host ">>> Temporarily enabling public access for deployment..."
        az acr update -n $env:AZURE_CONTAINER_REGISTRY_NAME --public-network-enabled true --default-action Allow --output none
        Write-Host ">>> Waiting for network changes to propagate (30s)..."
        Start-Sleep -Seconds 30
  # デプロイ完了後に Public Access を閉鎖
  postdeploy:
    posix:
      shell: sh
      run: |
        echo ">>> Re-disabling public access after deployment..."
        az acr update -n "$AZURE_CONTAINER_REGISTRY_NAME" --public-network-enabled false --default-action Deny --output none
        echo ">>> Public access disabled."
    windows:
      shell: pwsh
      run: |
        Write-Host ">>> Re-disabling public access after deployment..."
        az acr update -n $env:AZURE_CONTAINER_REGISTRY_NAME --public-network-enabled false --default-action Deny --output none
        Write-Host ">>> Public access disabled."
